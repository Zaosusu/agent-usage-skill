<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>算力资源管理局</title>
<style>
:root{
  --bg:#F5F6F8; --card:#FFFFFF; --ink:#171C26; --ink-2:#5A6472; --ink-3:#8A93A2;
  --line:#E4E7EC; --line-2:#EDF0F3; --accent:#2456D6; --accent-soft:#EEF3FE;
  --warn:#B45309; --warn-bg:#FDF3E7; --ok:#0F8A5F;
  --mono:"Cascadia Mono","JetBrains Mono",Consolas,"SF Mono",Menlo,monospace;
  --sans:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding:20px 20px 60px}
/* header */
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:6px 0 18px}
.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;letter-spacing:.2px}
.brand svg{width:26px;height:26px}
.brand-text{display:flex;flex-direction:column;gap:1px}
.brand-title{font-size:18px;font-weight:700;letter-spacing:.2px;line-height:1.2}
.brand-sub{font-size:12px;font-weight:500;color:var(--ink-2);line-height:1.2;letter-spacing:.3px}
.meta{margin-left:auto;display:flex;align-items:center;gap:14px;color:var(--ink-2);font-size:13px}
.meta .today-usage{font-size:14px;font-weight:600;color:var(--ink)}
.meta .today-usage .num{color:var(--accent);font-size:16px;margin-left:4px}
.meta .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:5px}
.live{display:inline-flex;align-items:center;gap:5px;color:var(--ok);font-weight:600;font-size:13px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite}
.live.off{color:var(--ink-3);font-weight:400}
.live.off i{background:var(--ink-3);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(24,163,120,.4)}70%{box-shadow:0 0 0 6px rgba(24,163,120,0)}100%{box-shadow:0 0 0 0 rgba(24,163,120,0)}}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:var(--sans)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:active{transform:translateY(1px)}
.switch{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);cursor:pointer;user-select:none}
.switch input{accent-color:var(--accent)}
/* kpi */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .lab{font-size:12px;color:var(--ink-2)}
.kpi .val{font-family:var(--mono);font-size:22px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--ink-3);margin-top:2px}
.kpi .val.est{color:var(--warn)}
/* 增量提示：绝对值被大分母稀释后，用「近 N 分钟 +X」让人一眼看出系统还活着 */
.delta{font-size:12px;margin-top:3px;font-variant-numeric:tabular-nums}
.delta.up{color:var(--ok)}
.delta.flat{color:var(--ink-3)}
.delta b{font-family:var(--mono);font-weight:600}
/* agent 活跃度：超过阈值没更新就标记出来 */
.agent-chip .stale{font-size:10px;color:var(--warn);background:var(--warn-bg);border:1px solid #F2DFC4;border-radius:999px;padding:0 5px;align-self:center}
.agent-chip .idle{font-size:10px;color:var(--ink-3);background:var(--line-2);border-radius:999px;padding:0 5px;align-self:center}
/* agent strip */
.agents{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.agent-chip{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;display:flex;align-items:baseline;gap:8px;transition:border-color .12s, box-shadow .12s}
.agent-chip:hover{border-color:var(--accent)}
.agent-chip.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.agent-chip .sw{width:8px;height:8px;border-radius:2px;align-self:center}
.agent-chip .nm{font-size:13px;font-weight:600}
.agent-chip .tk{font-family:var(--mono);font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.badge{font-size:11px;padding:1px 6px;border-radius:999px;background:var(--warn-bg);color:var(--warn);border:1px solid #F2DFC4}
/* grid & cards */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;grid-column:span 6}
.card.span2{grid-column:span 12}
.card h2{font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px;margin-bottom:10px}
.card h2 .ctrl{margin-left:auto;display:flex;gap:8px;align-items:center}
.chart{width:100%;height:300px}
.chart.tall{height:340px}
select,input[type=search]{border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:13px;font-family:var(--sans);background:#fff;color:var(--ink);max-width:220px}
/* table */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar .sp{margin-left:auto}
table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}
th{font-size:12px;color:var(--ink-2);font-weight:600;text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line-2);vertical-align:top;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr:hover td{background:#FAFBFC}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.ag{display:inline-flex;align-items:center;gap:5px}
.ag i{width:7px;height:7px;border-radius:2px;display:inline-block;flex:none}
.title-cell{white-space:normal;word-break:break-all}
.est-cell{color:var(--warn);font-size:12px}
.muted{color:var(--ink-3)}
.note{font-size:12px;color:var(--ink-3);margin-top:14px;line-height:1.7}
.note code{font-family:var(--mono);background:#EEF0F3;padding:0 4px;border-radius:4px;font-size:11px}
footer{margin-top:24px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.fallback{display:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
@media (max-width:900px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .card,.card.span2{grid-column:span 12}
  .chart{height:260px}
  .meta{margin-left:0;width:100%;justify-content:flex-start;flex-wrap:wrap}
}
@media (max-width:640px){
  body{font-size:15px}
  .meta,.btn{font-size:14px}
  select,input[type=search]{font-size:16px}
  .kpi .val{font-size:19px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="2.5" y="2.5" width="19" height="19" rx="5" stroke="#2456D6" stroke-width="2"/>
        <path d="M7 15.5V8.5M12 15.5V12M17 15.5V5.5" stroke="#2456D6" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      <div class="brand-text">
        <div class="brand-title">算力资源管理</div>
        <div class="brand-sub">算力 HR · Token 劳务派遣</div>
      </div>
    </div>
    <div class="meta">
      <span id="liveStatus" class="live"><i></i>实时监控中</span>
      <span><span class="dot"></span>最近扫描 <span id="scanTime" class="num">—</span></span>
    </div>
  </header>

  <section class="kpis" id="kpis"></section>
  <section class="agents" id="agentChips"></section>

  <section class="grid">
    <div class="card span2">
      <h2>每日 token 用量
        <span class="ctrl">
          <span id="rangeTotalLabel" style="font-size:12px;color:#8A93A2;margin-right:10px;font-weight:normal"></span><span id="avgDailyLabel" style="font-size:12px;color:#8A93A2;margin-right:10px;font-weight:normal"></span>
          <select id="rangeSel">
            <option value="1">今天</option>
            <option value="3" selected>近 3 天</option>
            <option value="7">近 7 天</option>
            <option value="14">近 14 天</option>
            <option value="30">近 30 天</option>
            <option value="90">近 90 天</option>
            <option value="all">全部</option>
          </select>
        </span>
      </h2>
      <div class="chart tall" id="dailyChart"></div>
    </div>
    <div class="card">
      <h2>各 Agent 总用量</h2>
      <div class="chart" id="agentChart"></div>
    </div>
    <div class="card" id="modelCard">
      <h2 id="modelTitle">模型用量 TOP 10</h2>
      <div class="chart" id="modelChart"></div>
    </div>
    <div class="card span2">
      <h2>按项目用量（按工作目录聚合）
        <span class="ctrl toolbar">
          <button class="btn" onclick="projPage(-1)" id="projPrev">上一页</button>
          <span id="projPageInfo" style="font-size:12px;color:#5A6472"></span>
          <button class="btn" onclick="projPage(1)" id="projNext">下一页</button>
        </span>
      </h2>
      <div class="chart tall" id="projectChart"></div>
    </div>
  </section>

  <section class="card">
    <h2>会话明细
      <span class="ctrl toolbar">
        <select id="agentFilter"><option value="">全部 Agent</option></select>
        <input type="date" id="dateStart" style="width:140px">
        <span style="color:#8A93A2">~</span>
        <input type="date" id="dateEnd" style="width:140px">
        <input type="search" id="searchBox" placeholder="搜索标题 / 模型 / 路径" style="width:180px">
      </span>
    </h2>
    <div style="overflow-x:auto">
      <table>
        <colgroup>
          <col style="width:9%"><col style="width:26%"><col style="width:14%">
          <col style="width:10%"><col style="width:9%"><col style="width:9%">
          <col style="width:11%"><col style="width:7%"><col style="width:5%">
        </colgroup>
        <thead>
          <tr>
            <th>Agent</th><th>标题</th><th>模型</th><th>最近活跃</th>
            <th class="num">输入</th><th class="num">输出</th><th class="num">缓存</th>
            <th class="num">总计</th><th>估</th>
          </tr>
        </thead>
        <tbody id="sessBody"></tbody>
      </table>
    </div>
    <div id="pager" style="display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:#5A6472"></div>
  </section>

  <div class="note" id="coverage"></div>
  <footer>
    <span>数据来源：各 Agent 本地会话/用量文件（只读解析，不修改任何 Agent 数据）</span>
    <span>Codex / Claude / WorkBuddy / CodeBuddy / Kimi 为真实计数 · 豆包 / 千问为估算</span>
  </footer>
</div>
<div class="fallback" id="fallback"></div>

<script>
  const DATA = null;  // 运行时从 /api/data 加载
</script>
<script>
window.__EChartsReady = false;
function loadECharts(src, onfail){
  var s = document.createElement('script');
  s.src = src;
  s.onload = function(){ if (window.echarts) { window.__EChartsReady = true; window.dispatchEvent(new Event('echarts-ready')); } };
  s.onerror = onfail || null;
  document.head.appendChild(s);
}
loadECharts('https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js', function(){
  loadECharts('https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js');
});
</script>
<script>
'use strict';
const PALETTE = {
  codex:'#2F5FD0', claude:'#E07B39', workbuddy:'#0F8A7D', codebuddy:'#4E9A2F',
  kimi:'#7A5CF0', zcode:'#B0601F', qwenworkcn:'#C7448A', doubao:'#0EA5E9'
};
const AGENT_ORDER = ['codex','claude','workbuddy','codebuddy','kimi','zcode','qwenworkcn','doubao'];
const colorOf = k => PALETTE[k] || '#8A93A2';

function fmt(n){
  if (n === null || n === undefined) return '—';
  n = Number(n);
  if (n < 10000) return n.toLocaleString('en-US');
  if (n < 1e8) return (n/1e4).toFixed(1) + '万';
  return (n/1e8).toFixed(2) + '亿';
}
function fmtRaw(n){ return Number(n||0).toLocaleString('en-US'); }
function fmtDate(ms){
  if (!ms) return '—';
  const d = new Date(ms);
  const p = x => String(x).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}

let data = (DATA && typeof DATA === 'object') ? DATA : null;
let filterAgent = '';
// 区间选择：默认近 3 天，并记住用户上次的选择（下次打开沿用）
const RANGE_KEY = 'agentUsage.range';
const RANGE_DEFAULT = '3';
const RANGE_VALID = ['1','3','7','14','30','90','all'];
function loadRange(){
  try {
    const v = localStorage.getItem(RANGE_KEY);
    if (v && RANGE_VALID.includes(v)) return v;
  } catch(_){}
  return RANGE_DEFAULT;
}
let range = loadRange();
let showAll = false;
let serving = true;
let chartsReady = false;
const $ = id => document.getElementById(id);

/* ---------- 增量追踪 ----------
   总量是 185 亿量级的绝对值，而每分钟增量约 0.0017%，两位小数显示看不出来。
   这里保留一个「刷新快照队列」，用近 N 分钟的差值告诉用户系统是否还活着。
   快照同时记 total 与 today 两个口径：
     - 挂在「今日用量」卡片下，用 today 差值 —— 分母小、灵敏度高（同样的增量，
       百分比读数比挂在总量下大两个数量级）。
   两个阈值（别混）：
     - SNAP_WINDOW_MS = 10 分钟：**基线回看窗口（封顶）**。基线取「至少 10 分钟前」
       的点 ⇒ 持续有动静时，读数从「近 1 分钟」一路累计到「近 10 分钟」就封顶不变，
       你看到的就是**近 10 分钟的流量**（一个稳定的速率，不会越滚越大）。
     - SNAP_RESET_GAP_MS = 15 分钟：**静默重置**。连续 15 分钟数值毫无变化 ⇒
       这段区间里什么都没发生，旧累积已无意义 ⇒ 清空队列，回到「开始追踪增量…」
       从此刻重新计时，避免出现「近 30 分钟」「近 2 小时」这种越滚越大的读数。
   静默判定看的是「数据有没有变」（activity.at），**不是渲染次数** ——
   否则页面自身的定时重绘会把静默刷掉，永远触发不了重置。
   快照只存内存 + sessionStorage（刷新页面不清零），不写后端。 */
const SNAP_KEY = 'agentUsage.snapshots';
const ACT_KEY = 'agentUsage.activity';
const SNAP_WINDOW_MS = 10 * 60 * 1000;     // 基线回看窗口（封顶）：近 10 分钟
const SNAP_RESET_GAP_MS = 15 * 60 * 1000;  // 静默重置阈值：15 分钟没动静就重来
const SNAP_MIN_GAP_MS = 60 * 1000;         // 至少每 60 秒记一个点，保证基线随时间推进
let snapshots = loadSnapshots();
let activity = loadActivity();             // {at: 最后一次「数值变化」的时间, today: 上次今日值}

function loadActivity(){
  try {
    const raw = sessionStorage.getItem(ACT_KEY);
    const o = raw ? JSON.parse(raw) : null;
    if (o && typeof o.at === 'number') return o;
  } catch(_){}
  return {at: 0, today: null};
}
function saveActivity(){
  try { sessionStorage.setItem(ACT_KEY, JSON.stringify(activity)); } catch(_){}
}

function loadSnapshots(){
  try {
    const raw = sessionStorage.getItem(SNAP_KEY);
    if (!raw) return [];
    const arr = JSON.parse(raw);
    if (!Array.isArray(arr)) return [];
    // 只接受当前格式的点（必须含 today + day）。
    // 旧格式（只有 t/total）必须丢弃：它的 baseDay 是空串 ⇒ sameDay 恒为 false，
    // 且会占住基线位置抢不回来 ⇒ 永久卡在「开始追踪增量…」。
    // 换口径/改字段时靠这条自动作废旧快照，不需要用户手动清 sessionStorage。
    return arr.filter(s => s && typeof s.t === 'number'
      && typeof s.today === 'number' && typeof s.day === 'string');
  } catch(_){ return []; }
}
function saveSnapshots(){
  try { sessionStorage.setItem(SNAP_KEY, JSON.stringify(snapshots.slice(-40))); } catch(_){}
}
/** 把当前 total / today 压入快照队列，返回基线信息
    关键一：按「时间间隔」记录，而不是只在数值变化时记录 ——
      否则数据完全冻结时队列永远只有 1 个点，会卡在「开始追踪增量…」，
      用户看到的反而是「可能挂了」，正是这个提示要解决的问题。
    关键二：间隔内**绝不回写已有快照的时间戳** ——
      否则数据每 5 秒都在变时（最需要显示增量的场景），last.t 被一路推到当前，
      `now - last.t >= 60s` 永远不成立，队列反而只剩 1 个点、永远建不起基线。
      当前值不需要进队列：算差值时它是入参，队列只负责按固定节奏留历史点。
    关键三：静默（连续 15 分钟数值没变）⇒ 清空队列重新累积。
      静默判定用 activity.at（数据变化的时刻），**不能用 snapshots 最后一点的时间** ——
      因为队列每 60 秒就会推进一个点，拿它当"最后活动时间"永远到不了 15 分钟。 */
function pushSnapshot(total, today, day){
  const now = Date.now();
  // 记录「数据变化」时刻：只有数值真的变了才算活动
  if (activity.today === null || activity.today !== today) {
    activity.at = now;
    activity.today = today;
    saveActivity();
  }
  // 静默超阈值：清空队列，回到「开始追踪增量…」，从此刻重新计时
  if (activity.at && now - activity.at >= SNAP_RESET_GAP_MS) {
    snapshots = [];
    activity.at = now;          // 重新开始计时，避免每轮都清空
    saveActivity();
  }
  const last = snapshots[snapshots.length-1];
  if (!last || now - last.t >= SNAP_MIN_GAP_MS) {
    snapshots.push({t: now, total: total, today: today, day: day});   // 到点就记，不管值变没变
  }
  // 丢掉窗口外的旧点，但**至少保留一个窗口外的点作基线**
  // （静默期间靠它显示「近 10 分钟 +0」，而不是退回「开始追踪增量…」）
  const cutoff = now - SNAP_WINDOW_MS;
  while (snapshots.length > 2 && snapshots[1].t < cutoff) snapshots.shift();
  saveSnapshots();
  return computeDelta(now);
}
/** 基线 = 窗口外最近的点；没有就用窗口内最早的点。
    minutes **封顶在 10 分钟**（SNAP_WINDOW_MS），这样：
      - 持续有动静：读数累计到 10 分钟就不再增长（稳定速率，可横向比较）
      - 静默未达重置阈值：显示「近 10 分钟 +0」，而不是越滚越大 */
function computeDelta(now){
  const cutoff = now - SNAP_WINDOW_MS;
  let base = null;
  for (const s of snapshots){ if (s.t < cutoff) base = s; else break; }
  if (!base) base = snapshots.length > 1 ? snapshots[0] : null;
  const last = snapshots[snapshots.length-1];
  // 无点，或基线就是最新点（区间为 0，形成不了增量）⇒ 无有效基线
  if (!base || base === last) return {hasPrev: false, minutes: 0, baseTotal: 0, baseToday: 0, baseDay: ''};
  const cap = Math.round(SNAP_WINDOW_MS / 60000);   // 封顶 10 分钟
  return {
    hasPrev: true,
    minutes: Math.max(1, Math.min(cap, Math.round((now - base.t)/60000))),
    baseTotal: base.total || 0,
    baseToday: base.today || 0,
    baseDay: base.day || '',
  };
}

let dailyChart = null, agentChart = null, modelChart = null, projectChart = null;
function initCharts(){
  if (!window.echarts || dailyChart) return dailyChart != null;
  try {
    dailyChart = echarts.init($('dailyChart'));
    agentChart = echarts.init($('agentChart'));
    modelChart = echarts.init($('modelChart'));
    projectChart = echarts.init($('projectChart'));
    window.addEventListener('resize', function(){ [dailyChart, agentChart, modelChart, projectChart].forEach(function(c){ c && c.resize(); }); });
    return true;
  } catch(e){ return false; }
}
function renderCharts(){
  if (!chartsReady) return;
  if (dailyChart) renderDaily();
  if (agentChart) renderAgents();
  if (modelChart) renderModels();
  if (projectChart) renderProjects();
}
function removeDegradeNote(){
  var n = document.getElementById('degradeNote');
  if (n) n.parentNode.removeChild(n);
}
function ensureCharts(){
  if (initCharts()) { chartsReady = true; renderCharts(); removeDegradeNote(); return; }
  if (window.echarts) { setTimeout(ensureCharts, 1500); return; }
  setTimeout(function(){
    if (initCharts()) { chartsReady = true; renderCharts(); removeDegradeNote(); }
    else if (!document.getElementById('degradeNote')) {
      chartsReady = false;
      const note = document.createElement('div');
      note.id = 'degradeNote';
      note.className = 'note';
      note.style.cssText = 'grid-column:span 12;background:var(--warn-bg);border:1px solid #F2DFC4;border-radius:12px;padding:12px 16px';
      note.innerHTML = '图表库（ECharts CDN）加载失败，图表暂不可用；表格与统计数字不受影响。请联网后刷新本页，或改用 <code>python serve.py</code> 访问。';
      document.querySelector('.grid').appendChild(note);
    }
  }, 6000);
}
window.addEventListener('echarts-ready', function(){ ensureCharts(); removeDegradeNote(); });

function toast(msg){
  const el = document.createElement('div');
  el.textContent = msg;
  el.style.cssText = 'position:fixed;right:20px;bottom:20px;background:#171C26;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:99;box-shadow:0 4px 16px rgba(0,0,0,.18)';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

/* ---------- KPI ---------- */
/** 给「开始追踪增量…约 N 秒后显示」挂一个轻量倒计时。
    数据没变化时不会触发重渲染，倒计时会僵在初始值 ⇒ 必须自己走字。 */
let countdownTimer = null;
function startCountdown(){
  const el = document.getElementById('deltaWait');
  if (!el) return;
  if (countdownTimer) clearInterval(countdownTimer);
  countdownTimer = setInterval(function(){
    const n = parseInt(el.dataset.wait || '0', 10) - 1;
    if (n <= 0) {
      clearInterval(countdownTimer); countdownTimer = null;
      // 时间到：主动重渲染一次，立刻把基线换成增量数字
      // （正常 SSE 推送也会覆盖，这里只是让切换更即时）
      try { render(); } catch(_){}
      return;
    }
    el.dataset.wait = n;
    el.textContent = '开始追踪增量…约 ' + n + ' 秒后显示';
  }, 1000);
}
function renderKpis(){
  const t = data.totals || {};
  const sessCount = data.session_count || data.sessions.length;
  const agents = data.agents || [];
  // 今日用量
  const days = data.days || [];
  const today = days.length ? days[days.length-1] : {};
  let todayTotal = 0;
  const todayAgents = (data.agents||[]).filter(a=>filterAgent? a.key===filterAgent : a.total_tokens>0);
  todayAgents.forEach(a => { todayTotal += (today[a.key]||0); });
  const estAgents = agents.filter(a=>a.est).map(a=>a.name);
  // 增量：绝对值被大分母稀释，用「近 N 分钟 +X」让用户一眼看出在动。
  // 挂在「今日用量」卡片下 ⇒ 用今日口径算差值，分母小、灵敏度高。
  const todayDate = today.date || '';
  const d = pushSnapshot(t.total_tokens||0, todayTotal, todayDate);
  // 跨天时基线属于昨天，今日差值无意义 ⇒ 重新开始追踪，避免虚高
  const sameDay = d.hasPrev && d.baseDay === todayDate;
  let deltaHtml, needCountdown = false;
  if (!sameDay) {
    // 首次打开要等满 1 分钟才有基线。写清倒计时，否则用户会以为卡住了。
    const wait = snapshots.length >= 1
      ? Math.max(1, Math.ceil((SNAP_MIN_GAP_MS - (Date.now() - snapshots[snapshots.length-1].t)) / 1000))
      : 60;
    needCountdown = true;
    deltaHtml = `<div class="delta flat" id="deltaWait" data-wait="${wait}">开始追踪增量…约 ${wait} 秒后显示</div>`;
  } else {
    const delta = todayTotal - d.baseToday;
    if (delta > 0) {
      // 今日刚起步时分母极小，百分比会失真 ⇒ 仅在基线非零时显示
      const pctHtml = d.baseToday > 0
        ? `（+${((delta / d.baseToday) * 100).toFixed(2)}%）` : '';
      deltaHtml = `<div class="delta up">近 ${d.minutes} 分钟 <b>+${fmt(delta)}</b>${pctHtml}</div>`;
    } else {
      deltaHtml = `<div class="delta flat">近 ${d.minutes} 分钟 <b>+0</b> · 无新增</div>`;
    }
  }
  const html = `
    <div class="kpi"><div class="lab">总 token 用量</div>
      <div class="val">${fmt(t.total_tokens||0)}</div>
      <div class="sub">${fmtRaw(t.total_tokens||0)} tokens · 真实${fmt(t.real_tokens||0)} + 估算${fmt(t.est_tokens||0)}</div></div>
    <div class="kpi"><div class="lab">其中：估算类（豆包/千问等）</div>
      <div class="val est">${fmt(t.est_tokens||0)}</div>
      <div class="sub">${fmtRaw(t.est_tokens||0)} tokens · 非精确计数</div></div>
    <div class="kpi"><div class="lab">会话总数</div>
      <div class="val">${sessCount.toLocaleString('en-US')}</div>
      <div class="sub">${agents.length} 个 Agent 数据源</div></div>
    <div class="kpi"><div class="lab">今日用量</div>
      <div class="val">${fmt(todayTotal)}</div>
      <div class="sub">${fmtRaw(todayTotal)} tokens · ${todayDate}</div>
      ${deltaHtml}</div>`;
  $('kpis').innerHTML = html;
  if (needCountdown) startCountdown();
}



/* ---------- agent chips ---------- */
/** 每个 agent 最后活动时间（从 sessions 里取 max last_activity_at） */
function lastActivityByAgent(){
  const m = {};
  (data.sessions||[]).forEach(s => {
    const k = s.agent, ts = s.last_activity_at || 0;
    if (!m[k] || ts > m[k]) m[k] = ts;
  });
  return m;
}
/** 活跃度标记：≤24h 绿点；1~7 天显示「N天前」；>7 天显示「N天前」并加重 */
function activityTag(lastMs){
  if (!lastMs) return '';
  const hours = (Date.now() - lastMs) / 3600000;
  if (hours <= 24) return '';                       // 今天活跃，不加标记
  const days = Math.floor(hours / 24);
  const label = days >= 1 ? `${days}天前` : `${Math.floor(hours)}小时前`;
  return days >= 7
    ? `<span class="stale" title="超过 ${days} 天没有新数据">${label}</span>`
    : `<span class="idle" title="${days} 天没有新数据">${label}</span>`;
}
function renderChips(){
  const agents = data.agents || [];
  const lastAct = lastActivityByAgent();
  const chips = agents.map(a => {
    const active = filterAgent === a.key ? 'active' : '';
    const badge = a.est ? '<span class="badge">估算</span>' : '';
    const act = activityTag(lastAct[a.key]);
    return `<div class="agent-chip ${active}" data-agent="${a.key}">
      <span class="sw" style="background:${colorOf(a.key)}"></span>
      <span class="nm">${a.name}</span>
      <span class="tk">${fmt(a.total_tokens)}</span>
      ${badge}${act}
    </div>`;
  }).join('');
  $('agentChips').innerHTML = chips;
  document.querySelectorAll('.agent-chip').forEach(el => {
    el.onclick = () => {
      const k = el.dataset.agent;
      filterAgent = (filterAgent === k) ? '' : k;
      render();
    };
  });
}

/* ---------- daily stacked ---------- */
function renderDaily(){
  if (!dailyChart || !data) return;
  const days = (data.days||[]);
  const n = range === 'all' ? days.length : Math.min(parseInt(range,10), days.length);
  const slice = days.slice(-n);
  const agents = (data.agents||[]).filter(a=>filterAgent? a.key===filterAgent : a.total_tokens>0);
  const aKeys = agents.map(a=>a.key);
  let avgTotal=0;
  slice.forEach(d => { aKeys.forEach(k => avgTotal += (d[k]||0)); });
  const avgDaily = slice.length ? Math.round(avgTotal/slice.length) : 0;
  const rangeLabel = {'1':'今天', '3':'近 3 天', '7':'近 7 天', '14':'近 14 天',
                      '30':'近 30 天', '90':'近 90 天', 'all':'全部'}[range] || ('近'+range+'天');
  const avgEl = document.getElementById('avgDailyLabel');
  if (avgEl) avgEl.textContent = rangeLabel+'平均: '+fmt(avgDaily)+'/天';
  const totalEl = document.getElementById('rangeTotalLabel');
  if (totalEl) totalEl.textContent = rangeLabel+'总量: '+fmt(avgTotal);
  const series = agents.map(a => ({
    name: a.name, type:'bar', stack:'t', barMaxWidth:22,
    itemStyle:{color:colorOf(a.key), borderRadius:0},
    emphasis:{focus:'series'},
    data: slice.map(d => d[a.key]||0)
  }));
  dailyChart.setOption({
    backgroundColor:'transparent',
    tooltip:{trigger:'axis', axisPointer:{type:'shadow'},

      formatter: ps => {

        const tot = ps.reduce((s,p)=>s+(p.value||0),0);
        s += `<b>当日合计: ${fmtRaw(tot)} (${fmt(tot)})</b>`;
        return s;
      }},
    legend:{show: agents.length>1, top:0, textStyle:{color:'#5A6472', fontSize:12}},
    grid:{left:8, right:12, top:34, bottom:0, containLabel:true},
    xAxis:{type:'category', data:slice.map(d=>d.date.slice(5)),
      axisLine:{lineStyle:{color:'#D5DAE1'}}, axisLabel:{color:'#8A93A2', fontSize:11}},
    yAxis:{type:'value', splitLine:{lineStyle:{color:'#EEF0F3'}},
      axisLabel:{color:'#8A93A2', fontSize:11, formatter:v=>fmt(v)}},
    series
  }, true);
}

/* ---------- project grouping ---------- */
function renderProjects(){
  if (!projectChart || !data) return;
  const sessions = (data.sessions||[]);
  const projMap = {};
  sessions.forEach(s => {
    const cwd = s.cwd || '';
    if (!cwd) return;
    // 提取项目名：取路径最后2级作为项目标识
    const parts = cwd.replace(/\\/g, '/').split('/').filter(Boolean);
    let proj = parts.length >= 2 ? parts.slice(-2).join('/') : (parts[0] || cwd);
    if (!proj) return;
    if (!projMap[proj]) projMap[proj] = {name: proj, tokens: 0, agents: new Set(), count: 0};
    projMap[proj].tokens += s.total_tokens || 0;
    projMap[proj].agents.add(s.agent_name);
    projMap[proj].count++;
  });
  const projects = Object.values(projMap).sort((a,b) => b.tokens - a.tokens).slice(0, 15);
  const series = [{
    type:'bar', barWidth:14,
    data: projects.map(p => ({
      value: p.tokens,
      itemStyle:{color:'#2456D6', borderRadius:[0,5,5,0]}
    })),
    label:{show:true, position:'right', formatter:p=>fmt(p.value), color:'#5A6472', fontFamily:'Cascadia Mono, Consolas, monospace', fontSize:11},
    emphasis:{focus:'self'}
  }];
  projectChart.setOption({
    tooltip:{trigger:'item', formatter: p => {
      const pr = projects[p.dataIndex];
      return `${pr.name}<br/>总计: <b>${fmtRaw(pr.tokens)}</b> (${fmt(pr.tokens)})<br/>${pr.count} 会话 · ${Array.from(pr.agents).join(', ')}`;
    }},
    grid:{left:8, right:80, top:8, bottom:0, containLabel:true},
    xAxis:{type:'value', show:false},
    yAxis:{type:'category', inverse:true, data:projects.map(p=>p.name), axisLine:{show:false}, axisTick:{show:false},
      axisLabel:{color:'#3A4250', fontSize:11, width:200, overflow:'truncate'}},
    series
  }, true);
}

/* ---------- sessions table with pagination ---------- */
const PAGE_SIZE = 10;
let currentPage = 1;

function getFilteredSessions(){
  if (!data) return [];
  const agents = data.agents||[];
  const filterSel = $('agentFilter');
  if (filterSel.options.length <= 1){
    agents.forEach(a => {
      const o = document.createElement('option');
      o.value = a.key; o.textContent = a.name + (a.est?' (估算)':'');
      filterSel.appendChild(o);
    });
  }
  const q = ($('searchBox').value||'').trim().toLowerCase();
  const fa = $('agentFilter').value;
  const ds = $('dateStart').value;
  const de = $('dateEnd').value;
  let rows = (data.sessions||[]).filter(s => {
    if (fa && s.agent!==fa) return false;
    if (q && !((s.title||'').toLowerCase().includes(q) || (s.model||'').toLowerCase().includes(q) || (s.cwd||'').toLowerCase().includes(q))) return false;
    if (s.last_activity_at){
      const d = new Date(s.last_activity_at);
      const dsDate = ds ? new Date(ds+'T00:00:00') : null;
      const deDate = de ? new Date(de+'T23:59:59') : null;
      if (dsDate && d < dsDate) return false;
      if (deDate && d > deDate) return false;
    }
    return true;
  }).sort((a,b) => (b.last_activity_at||0) - (a.last_activity_at||0));
  return rows;
}

function renderTable(){
  const rows = getFilteredSessions();
  const totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
  if (currentPage > totalPages) currentPage = totalPages;
  const start = (currentPage - 1) * PAGE_SIZE;
  const pageRows = rows.slice(start, start + PAGE_SIZE);
  $('sessBody').innerHTML = pageRows.map(s => `
    <tr>
      <td><span class="ag"><i style="background:${colorOf(s.agent)}"></i>${s.agent_name}</span></td>
      <td class="title-cell" title="${(s.title||'').replace(/"/g,'&quot;')}">${s.title||'—'}</td>
      <td title="${s.model||''}">${s.model||'—'}</td>
      <td class="num">${fmtDate(s.last_activity_at)}</td>
      <td class="num">${fmtRaw(s.input_tokens)}</td>
      <td class="num">${fmtRaw(s.output_tokens)}</td>
      <td class="num">${fmtRaw((s.cache_read_tokens||0)+(s.cache_write_tokens||0))}</td>
      <td class="num" style="font-weight:600">${fmt(s.total_tokens)}</td>
      <td class="est-cell">${s.est?'估算':''}</td>
    </tr>`).join('');
  // pager
  const pager = $('pager');
  pager.innerHTML = `
    <button class="btn" onclick="gotoPage(1)" ${currentPage<=1?'disabled':''}>首页</button>
    <button class="btn" onclick="gotoPage(${currentPage-1})" ${currentPage<=1?'disabled':''}>上一页</button>
    <span>第 ${currentPage} / ${totalPages} 页（共 ${rows.length} 条）</span>
    <button class="btn" onclick="gotoPage(${currentPage+1})" ${currentPage>=totalPages?'disabled':''}>下一页</button>
    <button class="btn" onclick="gotoPage(${totalPages})" ${currentPage>=totalPages?'disabled':''}>末页</button>
  `;
}
function gotoPage(p){ currentPage = p; renderTable(); }

/* ---------- coverage note ---------- */
function renderCoverage(){
  if (!data) return;
  const cov = data.coverage||[];
  const notes = cov.map(c => {
    if (c.status==='empty') return `<code>${c.name}</code>：${c.note}`;
    if (c.status==='estimate') return `<code>${c.name}</code>：${c.note}`;
    return '';
  }).filter(Boolean).join('　·　');
  $('coverage').innerHTML = notes ? '覆盖说明：' + notes : '';
}

function render(){
  if (!data) return;
  renderKpis(); renderChips(); renderTable(); renderCoverage();
  $('scanTime').textContent = data.generated_at_str || '—';
  ensureCharts();
}

/* ---------- 实时推送（SSE） ---------- */
let evtSource = null;
function connectSSE(){
  if (!serving || evtSource) return;
  try {
    evtSource = new EventSource('/api/stream');
    evtSource.addEventListener('update', function(e){
      try {
        const j = JSON.parse(e.data);
        if (j && j.ok && j.data){ data = j.data; render(); toast('已实时更新：' + data.generated_at_str); }
      } catch(_){}
    });
    evtSource.onopen = function(){
      const el = $('liveStatus');
      if (el){ el.classList.remove('off'); el.innerHTML = '<i></i>实时监控中'; }
    };
    evtSource.onerror = function(){
      const el = $('liveStatus');
      if (el && evtSource.readyState === EventSource.CLOSED){ el.classList.add('off'); el.innerHTML = '<i></i>实时连接断开（自动重连中）'; }
    };
  } catch(_){}
}

$('rangeSel').onchange = e => {
  range = e.target.value;
  try { localStorage.setItem(RANGE_KEY, range); } catch(_){}
  renderDaily();
};
// 回填上次选择（HTML 里的 selected 只是首屏兜底）
(function restoreRangeSel(){
  const sel = $('rangeSel');
  if (sel && sel.value !== range) sel.value = range;
})();
$('agentFilter').onchange = () => { currentPage = 1; renderTable(); };
$('searchBox').oninput = () => { currentPage = 1; renderTable(); };
$('dateStart').onchange = () => { currentPage = 1; renderTable(); };
$('dateEnd').onchange = () => { currentPage = 1; renderTable(); };

/* ---------- 让「近 N 分钟」真正滑动 ----------
   页面只在数据变化（SSE 推送）时才重渲染。若没有这个定时器，
   静默期间窗口不会往前走，读数会僵在最后一次刷新的值上。
   每 15 秒重算一次：窗口推进 + 静默超阈值时触发重置。 */
setInterval(function(){
  if (!data) return;
  try { renderKpis(); } catch(_){}
}, 15 * 1000);

/* ---------- boot ---------- */
(function boot(){
  if (location.protocol === 'file:') serving = false;
  if (!data){
    serving = false;
    fetch('/api/data', {cache:'no-store'}).then(r=>r.json()).then(j=>{
      if (j.ok && j.data){ serving = true; data = j.data; render(); connectSSE(); }
      else bootFallback();
    }).catch(bootFallback);
    return;
  }
  render();
  if (!serving){
    const el = $('liveStatus');
    if (el){ el.classList.add('off'); el.innerHTML = '<i></i>文件模式（无实时推送）'; }
    return;
  }
  connectSSE();
})();

function bootFallback(){
  $('fallback').style.display = 'block';
